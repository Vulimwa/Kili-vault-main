<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" width="1180" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Development case workflow</title>
  <desc id="desc">Case statuses and which role may move each one.</desc>
  <rect width="1180" height="360" fill="#F6F3EC"/>
  <text x="24" y="36" fill="#14302C" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Case workflow</text>
  <text x="24" y="60" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="13">Who is allowed to move a case, and to where.</text>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E4A"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle" font-size="12">
    <rect x="20" y="100" width="130" height="54" rx="10" fill="#14302C"/>
    <text x="85" y="132" fill="#F6F3EC" font-weight="700">AI flagged</text>
    <path d="M150 127 H176" stroke="#1F4E4A" marker-end="url(#b)"/>

    <rect x="176" y="100" width="140" height="54" rx="10" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="246" y="132" fill="#14302C" font-weight="700">Under review</text>
    <path d="M316 127 H342" stroke="#1F4E4A" marker-end="url(#b)"/>

    <rect x="342" y="100" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="427" y="132" fill="#14302C" font-weight="700">Mitigation required</text>
    <path d="M512 127 H538" stroke="#1F4E4A" marker-end="url(#b)"/>

    <rect x="538" y="100" width="160" height="54" rx="10" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="618" y="132" fill="#14302C" font-weight="700">Evidence submitted</text>
    <path d="M698 127 H724" stroke="#1F4E4A" marker-end="url(#b)"/>

    <rect x="724" y="100" width="150" height="54" rx="10" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="799" y="132" fill="#14302C" font-weight="700">Agency pending</text>
    <path d="M874 127 H900" stroke="#1F4E4A" marker-end="url(#b)"/>

    <rect x="900" y="88" width="120" height="40" rx="10" fill="#E7F0EE" stroke="#1F4E4A"/>
    <text x="960" y="113" fill="#14302C" font-weight="700">Verified</text>
    <rect x="900" y="138" width="120" height="40" rx="10" fill="#F8E8E4" stroke="#8C4A3A"/>
    <text x="960" y="163" fill="#14302C" font-weight="700">Rejected</text>

    <rect x="1020" y="250" width="130" height="48" rx="10" fill="#E4C36A"/>
    <text x="1085" y="279" fill="#14302C" font-weight="700">Closed</text>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#4A625C">
    <text x="24" y="220">Planner opens review, asks for mitigation, sends evidence onward, and closes a verified case.</text>
    <text x="24" y="244">Developer submits evidence when mitigation is required.</text>
    <text x="24" y="268">Agency verifies or rejects. A rejection can return the case to mitigation.</text>
    <text x="24" y="292">Closure writes the Property Development Record. The record is unavailable before then.</text>
    <text x="24" y="328" fill="#1F4E4A">Every move is stored as an audit event: actor, role, time, and what changed.</text>
  </g>
</svg>
