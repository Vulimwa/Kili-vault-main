<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="title desc">
  <title id="title">Kili-Vault user flows</title>
  <desc id="desc">Planner, developer, agency, and community journeys, and the handoffs between them.</desc>
  <rect width="1200" height="780" fill="#F6F3EC"/>
  <text x="28" y="40" fill="#14302C" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">User flows</text>
  <text x="28" y="66" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="14">Each role signs in to its own workspace. Work changes hands on the shared case.</text>

  <defs>
    <marker id="uf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E4A"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, sans-serif">
    <rect x="28" y="96" width="1144" height="150" rx="14" fill="#14302C"/>
    <text x="48" y="126" fill="#E4C36A" font-size="12" font-weight="700">PLANNER</text>
    <g text-anchor="middle" font-size="12">
      <rect x="48" y="144" width="120" height="72" rx="10" fill="#F6F3EC"/>
      <text x="108" y="174" fill="#14302C" font-weight="700">Sign in</text>
      <text x="108" y="194" fill="#4A625C">/planner</text>
      <path d="M168 180 H188" stroke="#C9DDD8" marker-end="url(#uf)"/>

      <rect x="188" y="144" width="150" height="72" rx="10" fill="#F6F3EC"/>
      <text x="263" y="174" fill="#14302C" font-weight="700">Map the change</text>
      <text x="263" y="194" fill="#4A625C">Parcel or detection</text>
      <path d="M338 180 H358" stroke="#C9DDD8" marker-end="url(#uf)"/>

      <rect x="358" y="144" width="150" height="72" rx="10" fill="#F6F3EC"/>
      <text x="433" y="174" fill="#14302C" font-weight="700">Review the case</text>
      <text x="433" y="194" fill="#4A625C">Open or promote</text>
      <path d="M508 180 H528" stroke="#C9DDD8" marker-end="url(#uf)"/>

      <rect x="528" y="144" width="170" height="72" rx="10" fill="#E4C36A"/>
      <text x="613" y="174" fill="#14302C" font-weight="700">Ask for mitigation</text>
      <text x="613" y="194" fill="#3E3420">Hands to developer</text>
      <path d="M698 180 H718" stroke="#C9DDD8" marker-end="url(#uf)"/>

      <rect x="718" y="144" width="160" height="72" rx="10" fill="#F6F3EC"/>
      <text x="798" y="174" fill="#14302C" font-weight="700">Send to agency</text>
      <text x="798" y="194" fill="#4A625C">After evidence</text>
      <path d="M878 180 H898" stroke="#C9DDD8" marker-end="url(#uf)"/>

      <rect x="898" y="144" width="150" height="72" rx="10" fill="#E4C36A"/>
      <text x="973" y="174" fill="#14302C" font-weight="700">Close</text>
      <text x="973" y="194" fill="#3E3420">Property record</text>
    </g>

    <rect x="28" y="262" width="1144" height="150" rx="14" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="48" y="292" fill="#1F4E4A" font-size="12" font-weight="700">DEVELOPER</text>
    <g text-anchor="middle" font-size="12">
      <rect x="48" y="310" width="120" height="72" rx="10" fill="#E7F0EE" stroke="#1F4E4A"/>
      <text x="108" y="340" fill="#14302C" font-weight="700">Sign in</text>
      <text x="108" y="360" fill="#4A625C">/developer</text>
      <path d="M168 346 H188" stroke="#1F4E4A" marker-end="url(#uf)"/>

      <rect x="188" y="310" width="160" height="72" rx="10" fill="#E7F0EE" stroke="#1F4E4A"/>
      <text x="268" y="340" fill="#14302C" font-weight="700">Check a plot</text>
      <text x="268" y="360" fill="#4A625C">Pin, preview, flags</text>
      <path d="M348 346 H368" stroke="#1F4E4A" marker-end="url(#uf)"/>

      <rect x="368" y="310" width="160" height="72" rx="10" fill="#E4C36A"/>
      <text x="448" y="340" fill="#14302C" font-weight="700">Submit the case</text>
      <text x="448" y="360" fill="#3E3420">AI flagged</text>
      <path d="M528 346 H548" stroke="#1F4E4A" marker-end="url(#uf)"/>

      <rect x="548" y="310" width="190" height="72" rx="10" fill="#E4C36A"/>
      <text x="643" y="340" fill="#14302C" font-weight="700">Upload evidence</text>
      <text x="643" y="360" fill="#3E3420">When mitigation is asked</text>

      <rect x="790" y="310" width="250" height="72" rx="10" fill="#FFFFFF" stroke="#C4A35A" stroke-dasharray="5 4"/>
      <text x="915" y="340" fill="#14302C" font-weight="700">Impact simulator</text>
      <text x="915" y="360" fill="#4A625C">Compare scenarios. Not saved.</text>
    </g>

    <rect x="28" y="428" width="1144" height="128" rx="14" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="48" y="458" fill="#1F4E4A" font-size="12" font-weight="700">AGENCY</text>
    <g text-anchor="middle" font-size="12">
      <rect x="48" y="472" width="120" height="60" rx="10" fill="#E7F0EE" stroke="#1F4E4A"/>
      <text x="108" y="506" fill="#14302C" font-weight="700">Sign in</text>
      <path d="M168 502 H200" stroke="#1F4E4A" marker-end="url(#uf)"/>

      <rect x="200" y="472" width="200" height="60" rx="10" fill="#E7F0EE" stroke="#1F4E4A"/>
      <text x="300" y="506" fill="#14302C" font-weight="700">Verification queue</text>
      <path d="M400 502 H432" stroke="#1F4E4A" marker-end="url(#uf)"/>

      <rect x="432" y="472" width="170" height="60" rx="10" fill="#E7F0EE" stroke="#1F4E4A"/>
      <text x="517" y="498" fill="#14302C" font-weight="700">Open the case</text>
      <text x="517" y="516" fill="#4A625C">Read evidence</text>
      <path d="M602 502 H634" stroke="#1F4E4A" marker-end="url(#uf)"/>

      <rect x="634" y="472" width="200" height="60" rx="10" fill="#E4C36A"/>
      <text x="734" y="498" fill="#14302C" font-weight="700">Verify or reject</text>
      <text x="734" y="516" fill="#3E3420">Notes stay on the audit</text>
    </g>

    <rect x="28" y="572" width="1144" height="128" rx="14" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="48" y="602" fill="#1F4E4A" font-size="12" font-weight="700">COMMUNITY</text>
    <g text-anchor="middle" font-size="12">
      <rect x="48" y="616" width="120" height="60" rx="10" fill="#E7F0EE" stroke="#1F4E4A"/>
      <text x="108" y="650" fill="#14302C" font-weight="700">Sign in</text>
      <path d="M168 646 H200" stroke="#1F4E4A" marker-end="url(#uf)"/>

      <rect x="200" y="616" width="200" height="60" rx="10" fill="#E7F0EE" stroke="#1F4E4A"/>
      <text x="300" y="642" fill="#14302C" font-weight="700">Drop a report</text>
      <text x="300" y="660" fill="#4A625C">Point, category, note</text>
      <path d="M400 646 H432" stroke="#1F4E4A" marker-end="url(#uf)"/>

      <rect x="432" y="616" width="230" height="60" rx="10" fill="#E7F0EE" stroke="#1F4E4A"/>
      <text x="547" y="642" fill="#14302C" font-weight="700">Ward map and my reports</text>
      <text x="547" y="660" fill="#4A625C">Track what was sent</text>

      <rect x="700" y="616" width="430" height="60" rx="10" fill="#F6F3EC" stroke="#1F4E4A"/>
      <text x="915" y="642" fill="#14302C" font-weight="700">Does not move a case by itself</text>
      <text x="915" y="660" fill="#4A625C">A person may later link the report to a detection or a case</text>
    </g>
  </g>

  <path d="M448 310 V246" stroke="#C4A35A" stroke-width="1.6" fill="none" marker-end="url(#uf)"/>
  <path d="M643 310 V246" stroke="#C4A35A" stroke-width="1.6" fill="none" marker-end="url(#uf)"/>

  <text x="28" y="748" fill="#14302C" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Handoffs</text>
  <text x="28" y="772" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="13">Gold steps are the handoff. A submitted plot check becomes a case the planner reviews. Uploaded evidence lets the planner send that case to the agency.</text>
  <text x="28" y="796" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="13">The agency verifies or rejects. Verify lets the planner close the case and open the property record. Reject returns the case to mitigation.</text>
</svg>
