<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Kili-Vault system context</title>
  <desc id="desc">People, Kili-Vault, ArcGIS, and the satellite pipeline around Kilimani Ward.</desc>
  <rect width="1120" height="640" fill="#F6F3EC"/>
  <text x="40" y="48" fill="#14302C" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">System context</text>
  <text x="40" y="74" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="14">Kilimani Ward planning review. People decide. The system records evidence.</text>

  <rect x="40" y="110" width="200" height="430" rx="16" fill="#E7F0EE" stroke="#1F4E4A" stroke-width="1.5"/>
  <text x="140" y="142" text-anchor="middle" fill="#14302C" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">People</text>
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#14302C">
    <rect x="60" y="168" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#B7CDC8"/>
    <text x="140" y="194" text-anchor="middle" font-weight="650">Planner</text>
    <text x="140" y="214" text-anchor="middle" fill="#4A625C" font-size="12">Review and close</text>
    <rect x="60" y="248" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#B7CDC8"/>
    <text x="140" y="274" text-anchor="middle" font-weight="650">Developer</text>
    <text x="140" y="294" text-anchor="middle" fill="#4A625C" font-size="12">Check and evidence</text>
    <rect x="60" y="328" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#B7CDC8"/>
    <text x="140" y="354" text-anchor="middle" font-weight="650">Agency</text>
    <text x="140" y="374" text-anchor="middle" fill="#4A625C" font-size="12">Verify or reject</text>
    <rect x="60" y="408" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#B7CDC8"/>
    <text x="140" y="434" text-anchor="middle" font-weight="650">Community</text>
    <text x="140" y="454" text-anchor="middle" fill="#4A625C" font-size="12">Observe and report</text>
  </g>

  <rect x="360" y="170" width="400" height="310" rx="18" fill="#14302C"/>
  <text x="560" y="214" text-anchor="middle" fill="#F6F3EC" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Kili-Vault</text>
  <text x="560" y="242" text-anchor="middle" fill="#C9DDD8" font-family="Segoe UI, sans-serif" font-size="13">React map workspace + Express API</text>
  <text x="560" y="292" text-anchor="middle" fill="#F6F3EC" font-family="Segoe UI, sans-serif" font-size="14">Candidate detections</text>
  <text x="560" y="316" text-anchor="middle" fill="#F6F3EC" font-family="Segoe UI, sans-serif" font-size="14">Development cases and audit</text>
  <text x="560" y="340" text-anchor="middle" fill="#F6F3EC" font-family="Segoe UI, sans-serif" font-size="14">Evidence and verification</text>
  <text x="560" y="364" text-anchor="middle" fill="#F6F3EC" font-family="Segoe UI, sans-serif" font-size="14">Property Development Record</text>
  <text x="560" y="430" text-anchor="middle" fill="#E4C36A" font-family="Segoe UI, sans-serif" font-size="13">Does not issue legality or approval</text>

  <rect x="880" y="110" width="200" height="180" rx="16" fill="#FFFFFF" stroke="#1F4E4A" stroke-width="1.5"/>
  <text x="980" y="146" text-anchor="middle" fill="#14302C" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">ArcGIS</text>
  <text x="980" y="176" text-anchor="middle" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="12">Parcels, buildings</text>
  <text x="980" y="196" text-anchor="middle" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="12">Roads, rivers, buffer</text>
  <text x="980" y="216" text-anchor="middle" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="12">Power, facilities</text>
  <text x="980" y="248" text-anchor="middle" fill="#1F4E4A" font-family="Segoe UI, sans-serif" font-size="12">Read directly by the map</text>

  <rect x="880" y="320" width="200" height="220" rx="16" fill="#FFFFFF" stroke="#1F4E4A" stroke-width="1.5"/>
  <text x="980" y="356" text-anchor="middle" fill="#14302C" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Observation</text>
  <text x="980" y="390" text-anchor="middle" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="12">Sentinel-2</text>
  <text x="980" y="410" text-anchor="middle" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="12">Earth Engine</text>
  <text x="980" y="430" text-anchor="middle" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="12">Spectral + Prithvi</text>
  <text x="980" y="462" text-anchor="middle" fill="#1F4E4A" font-family="Segoe UI, sans-serif" font-size="12">Candidate polygons</text>
  <text x="980" y="486" text-anchor="middle" fill="#1F4E4A" font-family="Segoe UI, sans-serif" font-size="12">into PostGIS</text>

  <path d="M240 320 H360" stroke="#1F4E4A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M760 250 H880" stroke="#1F4E4A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M760 420 H880" stroke="#1F4E4A" stroke-width="1.6"/>
  <path d="M880 420 H760" stroke="#1F4E4A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E4A"/>
    </marker>
  </defs>
</svg>
