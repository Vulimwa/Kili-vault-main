<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="title desc">
  <title id="title">Kili-Vault data flow</title>
  <desc id="desc">Writes into PostGIS and evidence files, and reads back to the map, the case, and the property record. ArcGIS and the simulator stay outside that record.</desc>
  <rect width="1200" height="860" fill="#F6F3EC"/>
  <text x="32" y="40" fill="#14302C" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Data flow</text>
  <text x="32" y="66" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="14">What is written into the record, what is only read, and what never leaves the browser.</text>

  <defs>
    <marker id="df" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E4A"/>
    </marker>
  </defs>

  <text x="32" y="104" fill="#1F4E4A" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">1  SATELLITE WRITE  ù  BATCH, NOT A PAGE REQUEST</text>

  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="32" y="122" width="180" height="78" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="122" y="154" fill="#14302C" font-size="14" font-weight="700">Sentinel-2</text>
    <text x="122" y="176" fill="#4A625C" font-size="12">Two time windows</text>

    <path d="M212 161 H248" stroke="#1F4E4A" stroke-width="1.5" marker-end="url(#df)"/>

    <rect x="248" y="122" width="220" height="78" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="358" y="154" fill="#14302C" font-size="14" font-weight="700">Earth Engine pipeline</text>
    <text x="358" y="176" fill="#4A625C" font-size="12">Spectral + Prithvi + persistence</text>

    <path d="M468 161 H504" stroke="#1F4E4A" stroke-width="1.5" marker-end="url(#df)"/>

    <rect x="504" y="122" width="190" height="78" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="599" y="154" fill="#14302C" font-size="14" font-weight="700">GeoJSON ingest</text>
    <text x="599" y="176" fill="#4A625C" font-size="12">Spatial dedup hash</text>

    <path d="M694 161 H730" stroke="#1F4E4A" stroke-width="1.5" marker-end="url(#df)"/>

    <rect x="730" y="114" width="438" height="94" rx="14" fill="#14302C"/>
    <text x="949" y="150" fill="#F6F3EC" font-size="15" font-weight="700">PostGIS ù detections</text>
    <text x="949" y="174" fill="#C9DDD8" font-size="12">Polygon, change type, confidence, explanation</text>
  </g>

  <text x="32" y="250" fill="#1F4E4A" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">2  HUMAN WRITES  ù  THROUGH THE API, CHECKED BY ROLE</text>

  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="32" y="268" width="210" height="86" rx="12" fill="#E4C36A"/>
    <text x="137" y="300" fill="#14302C" font-size="13" font-weight="700">Planner promotes</text>
    <text x="137" y="322" fill="#3E3420" font-size="12">Detection becomes a case</text>

    <rect x="258" y="268" width="210" height="86" rx="12" fill="#E4C36A"/>
    <text x="363" y="300" fill="#14302C" font-size="13" font-weight="700">Developer submits</text>
    <text x="363" y="322" fill="#3E3420" font-size="12">Plot check opens a case</text>

    <rect x="484" y="268" width="220" height="86" rx="12" fill="#E4C36A"/>
    <text x="594" y="300" fill="#14302C" font-size="13" font-weight="700">Developer uploads</text>
    <text x="594" y="322" fill="#3E3420" font-size="12">File, max 10 MB</text>

    <rect x="720" y="268" width="220" height="86" rx="12" fill="#E4C36A"/>
    <text x="830" y="300" fill="#14302C" font-size="13" font-weight="700">Planner or agency</text>
    <text x="830" y="322" fill="#3E3420" font-size="12">Status, mitigation, verify</text>

    <rect x="956" y="268" width="212" height="86" rx="12" fill="#E4C36A"/>
    <text x="1062" y="300" fill="#14302C" font-size="13" font-weight="700">Community reports</text>
    <text x="1062" y="322" fill="#3E3420" font-size="12">Point and description</text>

    <path d="M137 354 V392" stroke="#1F4E4A" stroke-width="1.4" marker-end="url(#df)"/>
    <path d="M363 354 V392" stroke="#1F4E4A" stroke-width="1.4" marker-end="url(#df)"/>
    <path d="M594 354 V392" stroke="#1F4E4A" stroke-width="1.4" marker-end="url(#df)"/>
    <path d="M830 354 V392" stroke="#1F4E4A" stroke-width="1.4" marker-end="url(#df)"/>
    <path d="M1062 354 V392" stroke="#1F4E4A" stroke-width="1.4" marker-end="url(#df)"/>

    <rect x="32" y="392" width="680" height="92" rx="14" fill="#14302C"/>
    <text x="372" y="428" fill="#F6F3EC" font-size="15" font-weight="700">PostGIS ù cases, audit, observations</text>
    <text x="372" y="452" fill="#C9DDD8" font-size="12">development_cases ù case_audit_events ù community_observations</text>

    <rect x="728" y="392" width="440" height="92" rx="14" fill="#14302C"/>
    <text x="948" y="428" fill="#F6F3EC" font-size="15" font-weight="700">Evidence files on disk</text>
    <text x="948" y="452" fill="#C9DDD8" font-size="12">File bytes plus case_evidence_items metadata</text>
  </g>

  <text x="32" y="526" fill="#1F4E4A" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">3  READS  ù  THE SCREEN DOES NOT COPY ARCGIS INTO THE DATABASE</text>

  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="32" y="548" width="250" height="110" rx="12" fill="#E7F0EE" stroke="#1F4E4A"/>
    <text x="157" y="582" fill="#14302C" font-size="14" font-weight="700">ArcGIS FeatureServers</text>
    <text x="157" y="606" fill="#4A625C" font-size="12">Parcels, buildings, roads</text>
    <text x="157" y="626" fill="#4A625C" font-size="12">Rivers, power, facilities</text>

    <path d="M282 603 H328" stroke="#1F4E4A" stroke-width="1.5" marker-end="url(#df)"/>
    <text x="305" y="592" fill="#1F4E4A" font-size="11">read</text>

    <rect x="328" y="548" width="230" height="110" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="443" y="586" fill="#14302C" font-size="14" font-weight="700">Browser map</text>
    <text x="443" y="610" fill="#4A625C" font-size="12">ArcGIS layers drawn live</text>
    <text x="443" y="630" fill="#4A625C" font-size="12">No write back to ArcGIS</text>

    <rect x="620" y="548" width="250" height="110" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="745" y="582" fill="#14302C" font-size="14" font-weight="700">Express API</text>
    <text x="745" y="606" fill="#4A625C" font-size="12">GeoJSON, stats, case,</text>
    <text x="745" y="626" fill="#4A625C" font-size="12">evidence, property record</text>

    <path d="M372 484 V516 H745" stroke="#1F4E4A" stroke-width="1.4" fill="none"/>
    <path d="M948 484 V516 H745" stroke="#1F4E4A" stroke-width="1.4" fill="none"/>
    <path d="M745 516 V548" stroke="#1F4E4A" stroke-width="1.4" marker-end="url(#df)"/>

    <rect x="900" y="548" width="268" height="110" rx="12" fill="#FFFFFF" stroke="#C4A35A" stroke-width="1.5"/>
    <text x="1034" y="582" fill="#14302C" font-size="14" font-weight="700">Impact simulator</text>
    <text x="1034" y="606" fill="#4A625C" font-size="12">Uses parcel geometry already</text>
    <text x="1034" y="626" fill="#4A625C" font-size="12">on screen. Nothing is saved.</text>

    <rect x="32" y="700" width="210" height="86" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="137" y="734" fill="#14302C" font-size="13" font-weight="700">Planner map</text>
    <text x="137" y="756" fill="#4A625C" font-size="12">Detections + cases GeoJSON</text>

    <rect x="258" y="700" width="210" height="86" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="363" y="734" fill="#14302C" font-size="13" font-weight="700">Dashboards</text>
    <text x="363" y="756" fill="#4A625C" font-size="12">Counts and queue priority</text>

    <rect x="484" y="700" width="230" height="86" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="599" y="734" fill="#14302C" font-size="13" font-weight="700">Case page</text>
    <text x="599" y="756" fill="#4A625C" font-size="12">Status, audit, evidence files</text>

    <rect x="730" y="700" width="250" height="86" rx="12" fill="#E4C36A"/>
    <text x="855" y="734" fill="#14302C" font-size="13" font-weight="700">Property record</text>
    <text x="855" y="756" fill="#3E3420" font-size="12">Assembled only after close</text>

    <path d="M745 658 V682" stroke="#1F4E4A" stroke-width="1.3" fill="none"/>
    <path d="M137 682 H855" stroke="#1F4E4A" stroke-width="1.3" fill="none"/>
    <path d="M137 682 V700" stroke="#1F4E4A" stroke-width="1.3" marker-end="url(#df)"/>
    <path d="M363 682 V700" stroke="#1F4E4A" stroke-width="1.3" marker-end="url(#df)"/>
    <path d="M599 682 V700" stroke="#1F4E4A" stroke-width="1.3" marker-end="url(#df)"/>
    <path d="M855 682 V700" stroke="#1F4E4A" stroke-width="1.3" marker-end="url(#df)"/>
  </g>

  <text x="32" y="826" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="13">A detection can exist with no case. A plot-check case can exist with no detection. Community reports stay in their own table until a person links one.</text>
</svg>
