<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 280" width="1180" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Kili-Vault evidence chain</title>
  <desc id="desc">From satellite detection through human review to the property record.</desc>
  <rect width="1180" height="280" fill="#F6F3EC"/>
  <text x="24" y="36" fill="#14302C" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Evidence chain</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E4A"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="24" y="70" width="140" height="88" rx="12" fill="#14302C"/>
    <text x="94" y="108" fill="#F6F3EC" font-size="13" font-weight="700">Satellite</text>
    <text x="94" y="128" fill="#C9DDD8" font-size="11">Sentinel-2</text>
    <path d="M164 114 H188" stroke="#1F4E4A" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="188" y="70" width="150" height="88" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="263" y="108" fill="#14302C" font-size="13" font-weight="700">Detection</text>
    <text x="263" y="128" fill="#4A625C" font-size="11">Candidate polygon</text>
    <path d="M338 114 H362" stroke="#1F4E4A" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="362" y="70" width="150" height="88" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="437" y="108" fill="#14302C" font-size="13" font-weight="700">Map context</text>
    <text x="437" y="128" fill="#4A625C" font-size="11">Parcel and layers</text>
    <path d="M512 114 H536" stroke="#1F4E4A" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="536" y="70" width="150" height="88" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="611" y="108" fill="#14302C" font-size="13" font-weight="700">Human review</text>
    <text x="611" y="128" fill="#4A625C" font-size="11">Planner decision</text>
    <path d="M686 114 H710" stroke="#1F4E4A" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="710" y="70" width="150" height="88" rx="12" fill="#FFFFFF" stroke="#1F4E4A"/>
    <text x="785" y="108" fill="#14302C" font-size="13" font-weight="700">Evidence</text>
    <text x="785" y="128" fill="#4A625C" font-size="11">Upload and verify</text>
    <path d="M860 114 H884" stroke="#1F4E4A" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="884" y="70" width="170" height="88" rx="12" fill="#E4C36A"/>
    <text x="969" y="108" fill="#14302C" font-size="13" font-weight="700">Property record</text>
    <text x="969" y="128" fill="#3E3420" font-size="11">After closure</text>
  </g>
  <text x="24" y="200" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="13">Each step keeps provenance. Spatial overlap, such as a river buffer, is a review signal.</text>
  <text x="24" y="224" fill="#4A625C" font-family="Segoe UI, sans-serif" font-size="13">It is not a finding of illegality, compliance, or approval.</text>
</svg>
